# Kevin Pabón

name: CI

on:
  push:
    branches:
      - main
      # Temporal: permite correr el workflow con el primer push de la rama.
      # Se quita después del merge a main.
      - ci/github-actions-vitest
  pull_request:
    branches:
      - main

jobs:
  ci:
    name: Lint, type-check, test y build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint:ci

      - name: Type-check
        run: npm run type-check

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build
