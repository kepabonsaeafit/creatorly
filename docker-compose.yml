# Author: Kevin Pabón
# Full Creatorly deployment: backend (NestJS + SQLite) and frontend (nginx).
# Run it through deploy.sh, which sets the VM IP and the JWT secret.

services:
  backend:
    build:
      context: ./backend
      args:
        CORS_ORIGIN: "${CORS_ORIGIN:-http://localhost:8080}"
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      SQLITE_PATH: /data/database.sqlite
      CORS_ORIGIN: "${CORS_ORIGIN:-http://localhost:8080}"
      JWT_SECRET: "${JWT_SECRET:?JWT_SECRET is not set: run deploy.sh}"
    volumes:
      - backend-data:/data

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:3000}
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  backend-data:
