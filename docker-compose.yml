# Author: Kevin Pabón
# Full Creatorly deployment: backend (NestJS + SQLite), frontend (nginx) and
# the Nuxt app.
# Run it through deploy.sh, which sets the VM IP and the JWT secret.

services:
  backend:
    build:
      context: ./backend
      args:
        CORS_ORIGIN: "${CORS_ORIGIN:-http://localhost:8080}"
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      SQLITE_PATH: /data/database.sqlite
      CORS_ORIGIN: "${CORS_ORIGIN:-http://localhost:8080}"
      JWT_SECRET: "${JWT_SECRET:?JWT_SECRET is not set: run deploy.sh}"
    volumes:
      - backend-data:/data

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:3000}
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

  # its data lives in nuxt/server/data and it serves its own API, so it needs
  # no environment; it uses 3001 because the backend already takes 3000
  nuxt:
    build:
      context: ./nuxt
    restart: unless-stopped
    ports:
      - "3001:3000"

volumes:
  backend-data:
